name: "Labels: Remove statuses on close"
on:
  pull_request_target:
    types: [closed]
jobs:
  add_label:
    # Change the repository name after you've made sure the team name is correct for your fork!
    if: ${{ (github.repository == 'Komonighub/for-forkonia') }}
    runs-on: ubuntu-latest
    steps:
    - if: "contains(github.event.pull_request.labels, 'Status: Untriaged')"
      run: |
        curl --silent --fail-with-body \
        -X DELETE \
        -H "Accept: application/vnd.github.v3+json" \
        -H "Authorization: token ${{ github.token }}" https://api.github.com/repos/${{ github.repository }}/issues/${{github.event.number}}/labels/Status%3A%20Untriaged
    - if: "contains(github.event.pull_request.labels, 'Status: Merge Conflict')"
      run: |
        curl --silent --fail-with-body \
        -X DELETE \
        -H "Accept: application/vnd.github.v3+json" \
        -H "Authorization: token ${{ github.token }}" https://api.github.com/repos/${{ github.repository }}/issues/${{github.event.number}}/labels/Status%3A%20Merge%20Conflict
    - if: "contains(github.event.pull_request.labels, 'Status: Needs Review')"
      run: |
        curl --silent --fail-with-body \
        -X DELETE \
        -H "Accept: application/vnd.github.v3+json" \
        -H "Authorization: token ${{ github.token }}" https://api.github.com/repos/${{ github.repository }}/issues/${{github.event.number}}/labels/Status%3A%20Needs%20Review
    - if: "contains(github.event.pull_request.labels, 'Status: Awaiting Changes')"
      run: |
        curl --silent --fail-with-body \
        -X DELETE \
        -H "Accept: application/vnd.github.v3+json" \
        -H "Authorization: token ${{ github.token }}" https://api.github.com/repos/${{ github.repository }}/issues/${{github.event.number}}/labels/Status%3A%20Awaiting%20Changes
        
